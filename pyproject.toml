[build-system]
requires = ["setuptools>=45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cowagent"
version = "1.0.0"
description = "CowAgent - AI Agent on WeChat and more"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "requests>=2.28.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.scripts]
cow = "cli.cli:main"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.mypy]
python_version = "3.12"
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false

[tool.ruff]
target-version = "py312"
include = ["business/**/*.py", "tests/test_investment_business.py"]
