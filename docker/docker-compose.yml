services:
  cowagent-investment-pg:
    image: postgres:16-alpine
    container_name: cowagent-investment-pg
    environment:
      POSTGRES_DB: cowagent_investment
      POSTGRES_USER: cowagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cowagent}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowagent -d cowagent_investment"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - cowagent-investment-pg-data:/var/lib/postgresql/data

  cowagent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.latest
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}
        INSTALL_MEDIA_TOOLS: ${INSTALL_MEDIA_TOOLS:-false}
        INSTALL_BUSINESS_DEPS: ${INSTALL_BUSINESS_DEPS:-true}
        INSTALL_OPTIONAL_DEPS: ${INSTALL_OPTIONAL_DEPS:-false}
        INSTALL_COW_CLI: ${INSTALL_COW_CLI:-false}
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        USE_APT_MIRROR: ${USE_APT_MIRROR:-false}
        USE_PIP_MIRROR: ${USE_PIP_MIRROR:-true}
    image: cowagent:local
    container_name: cowagent
    security_opt:
      - seccomp:unconfined
    ports:
      - "${WEB_PORT:-9899}:9899"
    environment:
      CHANNEL_TYPE: ${CHANNEL_TYPE:-wechatmp}
      MODEL: ${MODEL:-deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ZHIPU_AI_API_KEY: ${ZHIPU_AI_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_API_BASE: ${CLAUDE_API_BASE:-https://api.anthropic.com/v1}
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      OPEN_AI_API_BASE: ${OPEN_AI_API_BASE:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_BASE: ${GEMINI_API_BASE:-https://generativelanguage.googleapis.com}
      VOICE_TO_TEXT: ${VOICE_TO_TEXT:-openai}
      TEXT_TO_VOICE: ${TEXT_TO_VOICE:-openai}
      VOICE_REPLY_VOICE: ${VOICE_REPLY_VOICE:-False}
      SPEECH_RECOGNITION: ${SPEECH_RECOGNITION:-True}
      GROUP_SPEECH_RECOGNITION: ${GROUP_SPEECH_RECOGNITION:-False}
      USE_LINKAI: ${USE_LINKAI:-False}
      LINKAI_API_KEY: ${LINKAI_API_KEY:-}
      LINKAI_APP_CODE: ${LINKAI_APP_CODE:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      WECOM_BOT_ID: ${WECOM_BOT_ID:-}
      WECOM_BOT_SECRET: ${WECOM_BOT_SECRET:-}
      WECHATMP_APP_ID: ${WECHATMP_APP_ID:-}
      WECHATMP_APP_SECRET: ${WECHATMP_APP_SECRET:-}
      WECHATMP_TOKEN: ${WECHATMP_TOKEN:-}
      WECHATMP_AES_KEY: ${WECHATMP_AES_KEY:-}
      WECHATMP_PORT: ${WECHATMP_PORT:-8080}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 9899
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      AGENT: "True"
      AGENT_MEMORY_INDEX: ${AGENT_MEMORY_INDEX:-False}
      AGENT_MAX_CONTEXT_TOKENS: ${AGENT_MAX_CONTEXT_TOKENS:-50000}
      AGENT_MAX_CONTEXT_TURNS: ${AGENT_MAX_CONTEXT_TURNS:-20}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-20}
      COWAGENT_RUN_MIGRATIONS: ${COWAGENT_RUN_MIGRATIONS:-true}
      COWAGENT_INVESTMENT_DATABASE_URL: postgresql+psycopg://cowagent:${POSTGRES_PASSWORD:-cowagent}@cowagent-investment-pg:5432/cowagent_investment
      COWAGENT_BUSINESS_STORAGE_ROOT: /home/agent/cow/business_storage
    depends_on:
      cowagent-investment-pg:
        condition: service_healthy
    volumes:
      - cowagent-data:/home/agent/cow

volumes:
  cowagent-investment-pg-data:
  cowagent-data:
