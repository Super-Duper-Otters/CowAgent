<!DOCTYPE html>
<html lang="zh" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能投研辅助系统登录</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/vendor/fonts/inter/inter.css">
    <script src="assets/vendor/tailwind/tailwind.min.js"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                },
                colors: {
                    primary: {
                        50: '#EDFDF3', 100: '#D4FAE2', 200: '#ABF4C7', 300: '#74E9A4',
                        400: '#4ABE6E', 500: '#35A85B', 600: '#228547', 700: '#1C6B3B',
                        800: '#1A5532', 900: '#16462A',
                    }
                }
            }
        }
    }
    </script>
    <script>
    (function() {
        var theme = localStorage.getItem('cow_theme') || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var lang = localStorage.getItem('cow_lang') || 'zh';
        document.documentElement.setAttribute('lang', lang);
    })();
    </script>
</head>
<body id="login-page" class="min-h-screen bg-gray-50 dark:bg-[#111111] text-slate-800 dark:text-slate-200 font-sans">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <section class="w-full max-w-sm">
            <div class="flex flex-col items-center mb-8">
                <img src="assets/logo.jpg" alt="智能投研辅助系统" class="w-16 h-16 rounded-2xl mb-4 shadow-lg">
                <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">智能投研辅助系统</h1>
                <p id="login-subtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-1">请输入账号密码以访问控制台</p>
            </div>
            <form id="login-form" class="space-y-4" autocomplete="on">
                <input id="login-username" type="text" autocomplete="username" placeholder="Username"
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#1A1A1A] text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-400/50 focus:border-primary-400 transition-all duration-150 text-sm">
                <div class="relative">
                    <input id="login-password" type="password" autocomplete="current-password" placeholder="Password"
                           class="w-full px-4 py-3 pr-11 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-[#1A1A1A] text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-400/50 focus:border-primary-400 transition-all duration-150 text-sm">
                    <button type="button" id="login-toggle-pwd"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 cursor-pointer transition-colors"
                            aria-label="Toggle password visibility">
                        <i class="fas fa-eye text-sm"></i>
                    </button>
                </div>
                <p id="login-error" class="text-sm text-red-500 hidden"></p>
                <button id="login-btn" type="submit"
                        class="w-full py-3 rounded-xl bg-primary-500 hover:bg-primary-600 text-white font-medium text-sm cursor-pointer transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                    登录
                </button>
            </form>
        </section>
    </main>
    <script>
    const params = new URLSearchParams(window.location.search);
    const nextPath = params.get('next') || '/chat';
    const usernameInput = document.getElementById('login-username');
    const passwordInput = document.getElementById('login-password');
    const errorEl = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');
    const lang = localStorage.getItem('cow_lang') || 'zh';

    if (lang === 'en') {
        document.getElementById('login-subtitle').textContent = 'Enter credentials to access the console';
        loginBtn.textContent = 'Login';
    }

    function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
    }

    document.getElementById('login-toggle-pwd').addEventListener('click', function() {
        const icon = this.querySelector('i');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    });

    fetch('/auth/check').then(r => r.json()).then(data => {
        if (!data.auth_required || data.authenticated) {
            window.location.replace(nextPath);
        }
    }).catch(() => {});

    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault();
        const password = passwordInput.value;
        if (!password) return;
        loginBtn.disabled = true;
        errorEl.classList.add('hidden');
        fetch('/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: usernameInput.value || '', password})
        }).then(r => r.json()).then(data => {
            if (data.status === 'success') {
                window.location.replace(nextPath);
                return;
            }
            showError(lang === 'zh' ? '账号或密码错误' : 'Wrong username or password');
            passwordInput.value = '';
            passwordInput.focus();
        }).catch(() => {
            showError(lang === 'zh' ? '网络错误，请重试' : 'Network error, please retry');
        }).finally(() => {
            loginBtn.disabled = false;
        });
    });

    (usernameInput || passwordInput).focus();
    </script>
</body>
</html>
